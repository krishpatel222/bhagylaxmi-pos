{% extends 'base.html' %}

{% block title %}500 Server Error - ભાગ્યલક્ષ્મી એન્ટરપ્રાઇઝ{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5 shadow">
            <i class="fa-solid fa-triangle-exclamation fa-4x text-danger mb-3"></i>
            <h1 class="display-5 fw-bold text-danger">500</h1>
            <h3 class="fw-bold mb-3">Server Error / ટેકનિકલ ભૂલ</h3>
            <p class="text-muted mb-4">An unexpected system error occurred. Please try again or contact system administrator.</p>
            <a href="{% if user.profile.is_cashier %}{% url 'pos_billing' %}{% else %}{% url 'dashboard' %}{% endif %}" class="btn btn-green px-4 fw-bold">
                <i class="fa-solid fa-house me-2"></i> Go to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
