{% extends 'base.html' %}

{% block title %}{{ title }} - ભાગ્યલક્ષ્મી એન્ટરપ્રાઇઝ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="fw-bold mb-0 text-success"><i class="fa-solid fa-copyright me-2"></i> {{ title }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Brand Name <span class="text-danger">*</span></label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small mt-1">{{ form.name.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Description / વિગત</label>
                        {{ form.description }}
                    </div>

                    <div class="mb-4 form-check">
                        {{ form.is_active }}
                        <label class="form-check-label fw-bold" for="id_is_active">
                            Active Status
                        </label>
                    </div>

                    <div class="d-flex justify-content-between pt-2">
                        <a href="{% url 'brand_list' %}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-green px-4 fw-bold">
                            <i class="fa-solid fa-check me-1"></i> Save Brand
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
