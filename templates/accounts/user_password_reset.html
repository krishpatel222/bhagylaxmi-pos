{% extends "base.html" %}

{% block title %}Reset Password for {{ user_obj.username }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-key text-warning me-2"></i>Reset Password</h4>
                <small class="text-muted">User: {{ user_obj.get_full_name|default:user_obj.username }} ({{ user_obj.username }})</small>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                        <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'user_list' %}" class="btn btn-light"><i class="fa-solid fa-arrow-left me-1"></i> Cancel</a>
                        <button type="submit" class="btn btn-green px-4"><i class="fa-solid fa-floppy-disk me-1"></i> Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
