<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>Barcode Label - {{ product.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .barcode-card {
            width: 50mm;
            height: 25mm;
            border: 1px dashed #000;
            padding: 4px;
            text-align: center;
            background: #fff;
            margin: 5px;
            display: inline-block;
            box-sizing: border-box;
        }
        .shop-title {
            font-size: 9px;
            font-weight: bold;
        }
        .prod-name {
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .barcode-val {
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 2px 0;
        }
        .price-val {
            font-size: 11px;
            font-weight: bold;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #fff;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="no-print mb-4 text-center">
        <button onclick="window.print()" class="btn btn-primary px-4">Print Labels</button>
        <button onclick="window.close()" class="btn btn-secondary px-4">Close</button>
    </div>

    <div class="d-flex flex-wrap justify-content-center">
        {% for i in quantity_range %}
        <div class="barcode-card">
            <div class="shop-title">ભાગ્યલક્ષ્મી એન્ટરપ્રાઇઝ</div>
            <div class="prod-name">{{ product.name }}</div>
            <div class="barcode-val">||||||||||||||||||||<br>{{ product.barcode }}</div>
            <div class="price-val">MRP / SP: ₹{{ product.selling_price }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
